name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Check code linting with ruff
        run: uv run ruff check src tests scripts chatlens-v2/backend

      - name: Check code formatting with ruff
        run: uv run ruff format --check src tests scripts chatlens-v2/backend

      - name: Static type checking with mypy
        run: uv run mypy src scripts benchmarks chatlens-v2/backend

      - name: Run ADR, debt, and migration hygiene scripts
        run: |
          uv run python scripts/check_adrs.py
          uv run python scripts/harvest_debt.py
          uv run python scripts/lint_migration.py
          uv run python scripts/scan_motion.py

      - name: Negative Invariant - Verify zero raw datetime.now() in src/ outside clock.py
        run: |
          if git grep "datetime.now(" src/ | grep -v "src/utils/clock.py"; then
            echo "ERROR: Disallowed raw datetime.now() found outside src/utils/clock.py"
            exit 1
          fi

      - name: Negative Invariant - Verify zero temperature/top_p/top_k in ai_extractor.py
        run: |
          if git grep -E "temperature|top_p|top_k" src/parsing/ai_extractor.py; then
            echo "ERROR: Deprecated Gemini sampling parameters found in src/parsing/ai_extractor.py"
            exit 1
          fi

  test-python:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      # The offline E2E harness exercises routes against the built static export.
      # Jobs have isolated filesystems, so the separate frontend job cannot supply it.
      - name: Set up Node.js 24 for static-export E2E tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "chatlens-v2/frontend/package-lock.json"

      - name: Build frontend static export for Python E2E tests
        working-directory: chatlens-v2/frontend
        run: |
          npm ci
          npm run build

      - name: Run pytest (-W error::RuntimeWarning)
        run: uv run pytest -q -W error::RuntimeWarning

      - name: Run integration tests (-W error::RuntimeWarning)
        run: uv run pytest -q -m integration -W error::RuntimeWarning

      - name: Verify prompt drift between code and evaluation fixtures
        run: uv run pytest -q tests/test_prompt_drift.py

  test-frontend:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatlens-v2/frontend
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "chatlens-v2/frontend/package-lock.json"

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run frontend linter
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js export
        run: npm run build

  security:
    name: Secret & Supply-Chain Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          persist-credentials: false
        with:
          fetch-depth: 0

      - name: Install and run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: "-r ."

      - name: Run workflow linter (actionlint & zizmor)
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint
          pipx run zizmor --persona=pedantic .github/workflows/

  docker-build:
    name: Container Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build SPARK PA Daemon image
        run: docker build -t chatlens-daemon:ci .

      - name: Build Backend image
        run: docker build -t chatlens-backend:ci ./chatlens-v2/backend

      - name: Build Frontend image
        run: docker build -t chatlens-frontend:ci ./chatlens-v2/frontend
