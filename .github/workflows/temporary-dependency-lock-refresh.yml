name: One-time CI dependency lock refresh

on:
  push:
    branches: ["master"]
    paths:
      - "scripts/trigger-ci-lock-refresh.txt"

permissions:
  contents: write
  actions: write

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refresh Python dependency lock
        run: uv lock --upgrade-package anyio --upgrade-package certifi --upgrade-package idna --upgrade-package opentelemetry-api

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "chatlens-v2/frontend/package-lock.json"

      - name: Regenerate frontend lockfile using package.json overrides
        working-directory: chatlens-v2/frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate Python lock
        run: uv sync --frozen --all-extras --dev

      - name: Validate frontend lock
        working-directory: chatlens-v2/frontend
        run: npm ci

      - name: Confirm dependency vulnerabilities are resolved
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: "-r ."

      - name: Commit refreshed lockfiles and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock chatlens-v2/frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current; no commit required."
            exit 0
          fi
          git commit -m "fix(deps): refresh vulnerable dependency lockfiles"
          # Another repository automation may advance master while locks are resolving.
          # Rebase this lock-only commit instead of dropping either change set.
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
          gh workflow run ci.yml --ref master
