[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatlens"
version = "2.1.0"
description = "Enterprise-Grade Telegram-to-Google-Workspace PA Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.38.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-genai>=0.1.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "sentry-sdk>=1.40.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["chatlens", "chatlens-v2", "scratch", "_next", "docs"]


[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "telethon",
    "telethon.*",
    "googleapiclient",
    "googleapiclient.*"
]
ignore_missing_imports = true
