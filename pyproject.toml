[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "chatlens"
version = "2.1.0"
description = "Enterprise-Grade Telegram-to-Google-Workspace PA Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.38.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-genai>=0.1.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "sentry-sdk>=1.40.0",
    "tenacity>=8.2.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
backend = [
    "fastapi>=0.110.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pgvector>=0.2.0",
    "celery>=5.3.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.20",
]
integration = [
    "testcontainers[postgres]>=4.0.0",
    "psycopg[binary]>=3.1.0",
]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N", "B", "ASYNC", "S"]
ignore = ["S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ASYNC230"]
"scripts/*" = ["S603", "S607"]
"chatlens/*" = ["ALL"]
"chatlens-v2/*" = ["ALL"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks integration tests requiring docker",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "telethon",
    "telethon.*",
    "googleapiclient",
    "googleapiclient.*",
    "google_auth_oauthlib",
    "google_auth_oauthlib.*",
    "celery",
    "celery.*",
]
ignore_missing_imports = true
