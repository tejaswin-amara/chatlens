name: '🐛 Bug Report'
description: Report a bug or unexpected behavior in KL Sync
title: '[Bug]: '
labels: ['bug', 'triage']
assignees:
  - tejaswin-amara
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.
        **⚠️ Do NOT include ERP credentials, session tokens, or personal data.**
  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Which dashboard module is affected?
      options:
        - Login / Authentication
        - Dashboard Overview
        - Attendance
        - Timetable
        - Marks & CGPA
        - Profile
        - Fee Management
        - Tools & Calculators
        - Circulars
        - Hostel Allocation
        - Library Portal
        - Exam Seating
        - AI Copilot
        - Compliance Center
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile Safari (iOS)
        - Chrome (Android)
        - Other
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device Type
      options:
        - Desktop
        - Mobile
        - Tablet
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Error Output
      description: Paste any relevant browser console logs or terminal output.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop screenshots if applicable.
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have NOT included any ERP credentials or session tokens.
          required: true
