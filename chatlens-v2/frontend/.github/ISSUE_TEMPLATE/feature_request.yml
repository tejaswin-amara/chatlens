name: '✨ Feature Request'
description: Suggest a new feature or enhancement for KL Sync
title: '[Feature]: '
labels: ['enhancement', 'triage']
assignees:
  - tejaswin-amara
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Before submitting, please ensure your idea aligns with the **Ponytail Philosophy** (YAGNI, zero bloat, stdlib over deps).
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - New Dashboard Module
        - UI/UX Enhancement
        - Performance Optimization
        - Accessibility Improvement
        - AI Copilot Enhancement
        - i18n / Localization
        - Security Hardening
        - DevEx / Tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution. Keep it minimal!
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered alternative approaches?
  - type: dropdown
    id: ponytail
    attributes:
      label: Ponytail Compliance
      description: Does this feature add new dependencies?
      options:
        - 'No new dependencies (Ponytail-compliant ✅)'
        - 'Requires new dependency (justify in description)'
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions for duplicates.
          required: true
        - label: This feature aligns with the Ponytail Philosophy (YAGNI, minimal deps).
          required: true
