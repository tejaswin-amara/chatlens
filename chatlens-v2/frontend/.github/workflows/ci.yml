name: CI Quality Gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22]

    env:
      KL_SYNC_DEMO_MODE: 'true'
      KL_SYNC_AI_MODE: 'offline'
      SESSION_SECRET: 'ci-secret-key-testing-minimum-32-bytes-long'
      NODE_ENV: 'test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Security Audit
        run: npm audit --audit-level=high

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run API Boundary Tests
        run: npm run test:api

      - name: Run Agent-as-Judge AI Evaluation
        run: npx --yes tsx scripts/agent-as-judge.ts

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: 'production'
          SESSION_SECRET: 'ci-secret-key-testing-minimum-32-bytes-long'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test
