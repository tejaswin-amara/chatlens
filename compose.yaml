name: chatlens

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  chatlens-proxy:
    image: caddy:2-alpine
    container_name: chatlens-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-${DOMAIN_NAME:-localhost}}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      chatlens-frontend:
        condition: service_healthy
      chatlens-backend:
        condition: service_healthy
    networks:
      - chatlens-net

  chatlens-frontend:
    build:
      context: ./chatlens-v2/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
    container_name: chatlens-frontend
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      chatlens-backend:
        condition: service_healthy
    networks:
      - chatlens-net

  chatlens-migration:
    build:
      context: ./chatlens-v2/backend
      dockerfile: Dockerfile
    container_name: chatlens-migration
    restart: "no"
    logging: *default-logging
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chatlens}}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatlens-net

  chatlens-backend:
    build:
      context: ./chatlens-v2/backend
      dockerfile: Dockerfile
    container_name: chatlens-backend
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chatlens}}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SPARK_DB: /app/data/spark.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      CHATLENS_ALLOWED_EMAILS: ${CHATLENS_ALLOWED_EMAILS:-}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-admin.json
    volumes:
      - spark_data:/app/data:ro
      - uploads_data:/app/uploads
      - ${FIREBASE_ADMIN_CREDENTIALS_FILE:-./secrets/firebase-admin.json}:/run/secrets/firebase-admin.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatlens-migration:
        condition: service_completed_successfully
    networks:
      - chatlens-net

  chatlens-celery:
    build:
      context: ./chatlens-v2/backend
      dockerfile: Dockerfile
    container_name: chatlens-celery
    restart: unless-stopped
    logging: *default-logging
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-chatlens}}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker.celery_app inspect ping --timeout=5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatlens-migration:
        condition: service_completed_successfully
    networks:
      - chatlens-net

  chatlens-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatlens-daemon
    restart: unless-stopped
    logging: *default-logging
    environment:
      SPARK_DB: /app/data/spark.db
      SPARK_MODE: ${SPARK_MODE:-confirm}
      SPARK_CHAT_IDS: ${SPARK_CHAT_IDS:-}
      SPARK_MEDIA: ${SPARK_MEDIA:-false}
      SPARK_TIMETABLE: ${SPARK_TIMETABLE:-data/timetable_T04.toml}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_DAILY_BUDGET: ${GEMINI_DAILY_BUDGET:-50}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      OWNER_CHAT_ID: ${OWNER_CHAT_ID:-}
      GOOGLE_CREDENTIALS_BASE64: ${GOOGLE_CREDENTIALS_BASE64:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - spark_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sqlite3, sys; db = os.getenv('SPARK_DB', '/app/data/spark.db'); sys.exit(0 if os.path.exists(db) and sqlite3.connect(f'file:{db}?mode=ro', uri=True).execute('PRAGMA integrity_check').fetchone()[0] == 'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - chatlens-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatlens-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chatlens}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-chatlens}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chatlens-net

  redis:
    image: redis:7-alpine
    container_name: chatlens-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chatlens-net

volumes:
  spark_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  uploads_data:

networks:
  chatlens-net:
    driver: bridge
